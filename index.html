<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050607" />
  <title>Overcook — Stream, play, watch</title>
  <style>
    :root{color-scheme:dark;--bg:#050607;--panel:#0b0d10;--line:#202329;--muted:#969ba6;--white:#f5f6f8;--purple:#9c5bff;--red:#ee3e54;--green:#50d890}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.topbar{height:70px;position:sticky;top:0;z-index:10;background:rgba(4,5,6,.95);border-bottom:1px solid #17191c;display:flex;align-items:center;padding:0 max(calc((100vw - 1250px)/2),26px);gap:28px}.brand{width:40px;height:40px;display:grid;place-items:center;flex:none}.logo{width:34px;height:34px;border:2px solid #f5f6f8;border-radius:50%;position:relative;display:grid;place-items:center;font-size:17px}.logo:after{content:"";position:absolute;bottom:3px;left:9px;width:12px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:10px 10px 0 0}.search{margin:auto;width:min(590px,55vw);height:43px;border:1px solid #292c31;border-radius:24px;background:#08090b;display:flex;align-items:center;padding:0 16px;color:#737984}.search input{background:none;border:0;outline:0;color:white;width:100%;padding:8px}.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid #24272b;background:#0a0b0d;display:grid;place-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#64d783,#00a67d);font-size:20px;border:2px solid #363a40}.right{display:flex;align-items:center;gap:12px;margin-left:auto}.app{max-width:1260px;padding:32px 28px 80px;margin:auto}.selector{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#071716 0,transparent 65%);position:relative;overflow:hidden}.selector:before{content:"▷  ◁  ▽  △   ·   ▷  ▽  ◁  △   ·   △  ▷  ◁  ▽   ·   ◁  △  ▷";position:absolute;inset:13% 0;color:#17221f;font-size:20px;letter-spacing:16px;line-height:9;opacity:.5;pointer-events:none}.select-inner{position:relative;width:min(730px,95vw);padding:45px 20px}.select-inner .logo{width:62px;height:62px;font-size:31px;margin:0 auto 24px}.select-inner .logo:after{bottom:5px;left:17px;width:22px;height:13px}.select-inner h1{font-size:46px;line-height:1.15;margin:0 0 15px;letter-spacing:-1.1px}.sub{font-size:17px;color:#a3a8b2}.choice-row{display:flex;justify-content:center;gap:24px;margin:50px auto 0}.choice{width:324px;min-height:234px;text-align:left;padding:31px 30px;border-radius:17px;border:1px solid #24282d;background:rgba(4,5,6,.8);transition:.2s;box-shadow:0 10px 30px #0004}.choice:hover{border-color:#777;transform:translateY(-4px);background:#0c0e11}.choice-head{display:flex;align-items:center;gap:15px;font-size:22px;font-weight:750;margin-bottom:18px}.device{width:55px;height:55px;border-radius:13px;background:#101317;display:grid;place-items:center;font-size:27px}.choice p{color:#b5bac2;margin:0 0 18px}.choice small{color:#9da3ad}.choice small b{color:#e4e6e9;font-weight:500;margin-left:6px}.home-top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 24px}.section-title{font-size:25px;margin:0;font-weight:750}.featured{border:1px solid #1d2025;border-radius:23px;background:linear-gradient(105deg,#0c1516,#0a0c0e 50%,#0b0d10);padding:24px;display:grid;grid-template-columns:minmax(400px,1.65fr) minmax(270px,.8fr);gap:26px}.player{position:relative;aspect-ratio:16/9;min-height:280px;border:1px solid #202328;border-radius:16px;overflow:hidden;background:#06080a;display:flex;flex-direction:column;justify-content:space-between}.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 40%,var(--glow,#4040b8),transparent 34%),linear-gradient(150deg,var(--scene1,#11203a),#090a12 50%,var(--scene2,#351e43));display:grid;place-items:center;overflow:hidden}.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);background:linear-gradient(135deg,#ffffff1d,#0000);width:42%;aspect-ratio:1;left:12%;top:12%;box-shadow:360px 90px 0 -25px #ffffff10,-60px 210px 0 -60px #ffffff15}.scene:after{width:22%;left:auto;right:13%;top:47%;background:linear-gradient(135deg,var(--accent,#b766ff),#1114);box-shadow:0 0 65px var(--glow,#777)}.scene-word{position:relative;z-index:1;text-align:center;font-size:clamp(27px,4vw,56px);font-weight:900;text-shadow:0 4px 20px #000b;letter-spacing:-2px}.scene-word span{display:block;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#fff9;margin-bottom:10px}.live-tag{position:absolute;left:14px;top:14px;background:#ed304a;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:800}.player-controls{z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:linear-gradient(transparent,#000b);font-size:12px}.play{border:0;border-radius:50%;width:35px;height:35px;background:#ffffff25}.feed-info{padding:7px 3px}.feed-info h2{font-size:22px;margin:10px 0 2px}.muted{color:var(--muted)}.channel-row{display:flex;align-items:center;gap:10px;margin:14px 0}.channel-avatar{width:42px;height:42px;border:1px solid #3b3c41;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ec6d4f,#592e75);font-size:21px}.pill{display:inline-flex;border:1px solid #282c31;border-radius:20px;padding:4px 9px;color:#bdc2cb;font-size:11px;margin:8px 4px 0 0}.follow{border:0;background:#f2f3f6;color:#101115;border-radius:7px;padding:9px 16px;font-weight:700;margin-top:13px}.watchbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.watchbar button{background:#101216;border:1px solid #2c3036;border-radius:8px;padding:9px 12px}.filters{display:flex;gap:10px;margin:24px 0 17px}.filter{border:1px solid #262a30;background:#080a0c;border-radius:24px;padding:9px 16px}.filter.active{background:#f3f4f6;color:#111;border-color:#f3f4f6}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.card{min-width:0;border:1px solid #1d2025;border-radius:14px;background:#090b0e;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#555b64}.thumb{height:auto;aspect-ratio:16/10;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 66% 30%,var(--glow),transparent 39%),linear-gradient(140deg,var(--scene1),#0b0c14 60%,var(--scene2))}.thumb:after{content:"";position:absolute;inset:auto -10% -45% 45%;width:55%;aspect-ratio:1;background:var(--accent);filter:blur(40px);opacity:.48;border-radius:50%}.thumb .emoji{z-index:1;font-size:48px;filter:drop-shadow(0 10px 15px #0009)}.thumb .live-tag{font-size:10px;top:10px;left:10px}.views{position:absolute;z-index:2;right:9px;top:10px;font-size:11px;background:#0009;border-radius:3px;padding:3px 5px}.card-copy{padding:12px}.card h3{font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0 0 3px}.card .pill{font-size:10px;padding:2px 7px;margin-top:7px}.stream-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.detail-player{aspect-ratio:16/9}.stream-meta{padding:17px 4px;border-bottom:1px solid #25282d}.stream-meta h1{font-size:23px;margin:0 0 4px}.market,.chat{border:1px solid #22252b;border-radius:15px;background:#0b0d10;padding:18px;margin-bottom:17px}.market h2,.chat h2{font-size:16px;margin:0 0 5px}.market small{color:var(--muted)}.market-question{font-weight:700;margin:17px 0 12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.market-option{border:1px solid #32343a;border-radius:9px;background:#121419;padding:13px 8px;text-align:center}.market-option.selected{border-color:var(--purple);background:#20152f}.market-option b{display:block;font-size:17px;color:#c99dff}.market-confirm{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#9152ea;font-weight:750}.market-state{font-size:12px;color:#be9bec;margin-top:8px;min-height:18px}.chat{height:350px;display:flex;flex-direction:column}.messages{overflow:auto;flex:1;font-size:12px;color:#c5c8ce}.message{margin:8px 0}.message b{color:#c990ff;margin-right:5px}.chat-form{display:flex;gap:5px;margin-top:8px}.chat-form input{min-width:0;flex:1;background:#15171b;border:1px solid #2b2e34;border-radius:6px;padding:8px;color:#fff;outline:0}.chat-form button{border:0;border-radius:6px;background:#a057ef;padding:0 11px}.notice{position:fixed;top:80px;right:25px;z-index:20;padding:14px 18px;background:#181a1f;border:1px solid #383b42;border-radius:12px;box-shadow:0 10px 40px #0009;max-width:300px}.mobile-shell{height:calc(100vh - 70px);min-height:620px;max-width:460px;margin:0 auto;position:relative;overflow:hidden;background:#0a0b11}.mobile-reel{height:100%;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;transition:transform .3s ease}.mobile-scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,var(--glow),transparent 42%),linear-gradient(155deg,var(--scene1),#080910 54%,var(--scene2));display:grid;place-items:center;overflow:hidden}.mobile-scene:before{content:"";position:absolute;width:90%;height:35%;border-radius:50%;background:var(--accent);filter:blur(100px);opacity:.35;top:25%}.mobile-scene .scene-word{font-size:40px;text-align:center}.mobile-scene .scene-word span{font-size:11px}.phone-frame{position:absolute;inset:0;border:9px solid #0006;pointer-events:none;z-index:1}.reel-info{z-index:2;position:absolute;left:20px;right:76px;bottom:98px;text-shadow:0 2px 8px #000}.reel-info h2{font-size:21px;margin:7px 0 2px}.reel-actions{position:absolute;right:17px;bottom:118px;z-index:2;display:flex;flex-direction:column;gap:21px;align-items:center}.reel-actions button{width:48px;height:48px;border:0;border-radius:50%;background:#17181c99;font-size:21px}.reel-actions small{font-size:10px;text-shadow:0 1px 4px #000}.mobile-nav{position:absolute;z-index:3;bottom:0;left:0;right:0;height:67px;background:#06070ad9;border-top:1px solid #ffffff17;display:flex;justify-content:space-around;align-items:center}.mobile-nav button{background:none;border:0;color:#afb3bc;font-size:11px}.mobile-nav .current{color:#fff}.swipe-hint{position:absolute;z-index:4;top:18px;left:50%;transform:translateX(-50%);background:#0008;border-radius:20px;padding:6px 13px;font-size:11px;color:#ffffffbc;transition:opacity 1s}.menu-pop{position:absolute;right:35px;top:61px;background:#14161b;padding:13px 18px;border:1px solid #32353c;border-radius:10px;z-index:20;min-width:175px;box-shadow:0 8px 26px #0009}.menu-pop p{margin:4px 0;color:#d8dbe0}
    @media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.featured{grid-template-columns:1fr}.feed-info{padding:0}.stream-layout{grid-template-columns:1fr 290px}}
    @media(max-width:680px){.topbar{height:60px;padding:0 13px;gap:8px}.search{width:auto;flex:1;height:39px}.iconbtn{width:36px;height:36px}.avatar{width:31px;height:31px}.app{padding:22px 14px 60px}.selector{min-height:calc(100vh - 60px)}.select-inner h1{font-size:34px}.sub{font-size:14px}.choice-row{flex-direction:column;align-items:center;gap:14px;margin-top:32px}.choice{min-height:auto;width:min(100%,390px);padding:19px}.choice-head{font-size:19px;margin-bottom:10px}.device{width:45px;height:45px}.choice p{font-size:13px;margin-bottom:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.thumb .emoji{font-size:40px}.card-copy{padding:10px}.featured{padding:12px;gap:15px;border-radius:16px}.player{min-height:0}.scene-word{font-size:32px}.feed-info h2{font-size:19px}.home-top .section-title{font-size:21px}.stream-layout{grid-template-columns:1fr}.detail-player{aspect-ratio:16/10}.market{order:2}.chat{height:300px}.stream-meta h1{font-size:20px}.mobile-shell{height:calc(100dvh - 60px);min-height:520px;max-width:none;margin:-22px -14px 0}.reel-info{bottom:100px}.reel-actions{bottom:108px}.right{gap:7px}}
  </style>
</head>
<body>
  <header class="topbar" id="header"></header>
  <main id="app"></main>
  <script>
  const streams=[
    {id:'1',title:'Clash Royale Master II',user:'John Pork',emoji:'👑',tags:['English','Competitive'],views:'9.2K',colors:['#122542','#42274f','#627cff']},
    {id:'2',title:'Late Night Just Chatting',user:'Woody',emoji:'🎙️',tags:['IRL','Chill'],views:'7.1K',colors:['#422b1d','#332450','#f19b51']},
    {id:'3',title:'VALORANT Ranked Grind',user:'Buzz Lightyear',emoji:'🚀',tags:['Shooter','Ranked'],views:'5.8K',colors:['#401b2b','#182a50','#fa526a']},
    {id:'4',title:'Minecraft Mega Build',user:'Jessie',emoji:'🧱',tags:['Creative','Chill'],views:'4.2K',colors:['#153d2a','#493322','#6bd286']},
    {id:'5',title:'Apex Predator Push',user:'Rex',emoji:'🦖',tags:['FPS','Ranked'],views:'6.6K',colors:['#4c211d','#2f1d35','#f27650']},
    {id:'6',title:'Lo-Fi Study Session',user:'Bo Peep',emoji:'🎧',tags:['Music','Chill'],views:'3.3K',colors:['#322543','#152c49','#8b6cf3']},
    {id:'7',title:'Esports Highlights LIVE',user:'Hamm',emoji:'🏆',tags:['Highlights','Clips'],views:'8.1K',colors:['#4a3114','#391a36','#ffbf4e']},
    {id:'8',title:'IRL Travel Adventures',user:'Slinky Dog',emoji:'🌅',tags:['Travel','Outdoors'],views:'2.9K',colors:['#123b49','#422243','#4ed5cd']},
    {id:'9',title:'Indie Game Showcase',user:'Bullseye',emoji:'🕹️',tags:['Indie','Variety'],views:'1.5K',colors:['#183357','#2d2051','#66a7fa']},
    {id:'10',title:'Speedrunning Classics',user:'Mr. Potato Head',emoji:'⚡',tags:['Speedrun','Retro'],views:'3.9K',colors:['#482324','#1d2240','#fb6955']},
    {id:'11',title:'Art Commission Live',user:'Mrs. Potato Head',emoji:'🎨',tags:['Art','Design'],views:'2.2K',colors:['#482844','#212b47','#df72bf']},
    {id:'12',title:'Retro Console Repair',user:'Army Men',emoji:'🛠️',tags:['Tech','DIY'],views:'1.1K',colors:['#1a3d39','#313123','#72c39b']}
  ];
  const state={mode:null,route:'selector',filter:'Live',search:'',stream:streams[0],selected:null,reel:0,liked:false,followed:false,chat:[['Mod','Welcome to the stream!'],['pixel_pilot','That last match was wild'],['snack_attack','Let’s go John!']],notice:'',menu:''};
  const app=document.querySelector('#app'),header=document.querySelector('#header');
  function logo(){return '<span class="logo">♧</span>'}
  function drawHeader(){header.innerHTML=`<a class="brand" href="#" aria-label="Overcook home" onclick="goHome(event)">${logo()}</a><label class="search">⌕ <input id="search" placeholder="Search channels, games..." value="${esc(state.search)}" autocomplete="off" /></label><div class="right"><button class="iconbtn" aria-label="Notifications" onclick="toggleMenu('notifications')">♧</button><button class="iconbtn" aria-label="Profile" onclick="toggleMenu('profile')"><span class="avatar">🐸</span></button></div>${state.menu?`<div class="menu-pop">${state.menu==='profile'?'<p><b>Sample User</b></p><p>Preferences</p><p onclick="goSelector()">Switch experience</p>':'<p><b>Notifications</b></p><p>You’re all caught up.</p>'}</div>`:''}`;
    document.querySelector('#search').oninput=e=>{state.search=e.target.value;if(state.route==='home')renderHomeGrid()};
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function goHome(e){e?.preventDefault();state.route=state.mode==='mobile'?'mobile':'home';state.menu='';render()}
  function goSelector(){state.route='selector';state.menu='';render()}
  function pickMode(mode){state.mode=mode;state.route=mode==='mobile'?'mobile':'home';state.menu='';history.pushState({mode},'',mode==='mobile'?'#mobile':'#home');render()}
  function chooseStream(id){state.stream=streams.find(s=>s.id===id)||streams[0];state.route='stream';state.selected=null;render();}
  function toggleMenu(name){state.menu=state.menu===name?'':name;drawHeader()}
  function notify(message){state.notice=message;renderNotice();setTimeout(()=>{state.notice='';renderNotice()},2300)}
  function renderNotice(){let node=document.querySelector('.notice');if(state.notice){if(!node){node=document.createElement('div');node.className='notice';document.body.append(node)}node.textContent=state.notice}else node?.remove()}
  function scene(s,compact=false){return `<div class="scene" style="--scene1:${s.colors[0]};--scene2:${s.colors[1]};--glow:${s.colors[2]};--accent:${s.colors[2]}"><div class="scene-word"><span>Live now · ${s.views} viewers</span>${s.emoji} ${esc(s.title)}</div></div>`}
  function player(s,detail=false){return `<div class="player ${detail?'detail-player':''}" style="--scene1:${s.colors[0]};--scene2:${s.colors[1]};--glow:${s.colors[2]};--accent:${s.colors[2]}">${scene(s)}<span class="live-tag">LIVE</span><div class="player-controls"><button class="play" aria-label="Pause stream" onclick="togglePlay(this)">Ⅱ</button><span>🔊 ━━━━━ ● &nbsp; 🎙 ━━━━━ ●</span><button aria-label="Theater mode" onclick="document.querySelector('.player').classList.toggle('theater')">▣</button></div></div>`}
  function renderSelector(){app.innerHTML=`<section class="selector"><div class="select-inner">${logo()}<h1>Choose Your Experience</h1><div class="sub">Select the version that best fits your device</div><div class="choice-row"><button class="choice" onclick="pickMode('desktop')"><div class="choice-head"><span class="device">▣</span>Desktop</div><p>Full-featured experience with betting panels, chat, and detailed stream information</p><small>Best for:<b>Laptops, Desktops, Tablets</b></small></button><button class="choice" onclick="pickMode('mobile')"><div class="choice-head"><span class="device">▯</span>Mobile</div><p>Vertical reels experience optimized for touch, with swipe navigation and mobile controls</p><small>Best for:<b>Phones, Small Tablets</b></small></button></div></div></section>`}
  function card(s){return `<a class="card" href="#stream/${s.id}" onclick="event.preventDefault();chooseStream('${s.id}')"><div class="thumb" style="--scene1:${s.colors[0]};--scene2:${s.colors[1]};--glow:${s.colors[2]};--accent:${s.colors[2]}"><span class="emoji">${s.emoji}</span><span class="live-tag">Live</span><span class="views">${s.views} viewers</span></div><div class="card-copy"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.user)}</div>${s.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></a>`}
  function filtered(){const q=state.search.toLowerCase();return streams.filter(s=>(!q||`${s.title} ${s.user} ${s.tags.join(' ')}`.toLowerCase().includes(q))&&(state.filter==='Live'||['Chill','Creative','Music','Travel'].some(t=>s.tags.includes(t))))}
  function renderHome(){const s=streams[0];app.innerHTML=`<div class="app"><div class="home-top"><h1 class="section-title">${state.filter==='Live'?'Live channels':'Recommended for you'}</h1><div class="muted">${streams.length} channels live</div></div><section class="featured"><div>${player(s)}<div class="watchbar"><div><h2 style="font-size:18px;margin:12px 0 2px">${s.title}</h2><span class="muted">${s.user} · ${s.views} viewers</span></div><button onclick="chooseStream('1')">Watch stream ↗</button></div></div><div class="feed-info"><div class="muted">FEATURED LIVE STREAM</div><h2>${s.title}</h2><div class="channel-row"><div class="channel-avatar">🐽</div><div><b>${s.user}</b><div class="muted">Streaming now</div></div></div><div class="muted">${s.tags.join(' · ')}</div>${s.tags.map(t=>`<span class="pill">${t}</span>`).join('')}<br/><button class="follow" onclick="chooseStream('1')">Watch now</button></div></section><div class="filters"><button class="filter ${state.filter==='Live'?'active':''}" onclick="setFilter('Live')">Live</button><button class="filter ${state.filter==='Recommended'?'active':''}" onclick="setFilter('Recommended')">Recommended</button></div><div class="grid" id="grid">${filtered().map(card).join('')||'<div class="muted">No channels match your search.</div>'}</div></div>`}
  function renderHomeGrid(){const grid=document.querySelector('#grid');if(grid)grid.innerHTML=filtered().map(card).join('')||'<div class="muted">No channels match your search.</div>'}
  function setFilter(f){state.filter=f;render()}
  function togglePlay(btn){btn.textContent=btn.textContent==='Ⅱ'?'▶':'Ⅱ';btn.setAttribute('aria-label',btn.textContent==='Ⅱ'?'Pause stream':'Play stream')}
  function renderStream(){const s=state.stream;app.innerHTML=`<div class="app"><div class="stream-layout"><div><div>${player(s,true)}</div><section class="stream-meta"><div class="muted">LIVE NOW · ${s.views} viewers</div><h1>${esc(s.title)}</h1><div class="watchbar"><div class="channel-row" style="margin:8px 0"><div class="channel-avatar">${s.emoji}</div><div><b>${esc(s.user)}</b><div class="muted">${s.tags.join(' · ')} · This feed is mocked for demo purposes.</div></div></div><button class="follow" onclick="state.followed=!state.followed;this.textContent=state.followed?'Following':'Follow Channel'">${state.followed?'Following':'Follow Channel'}</button></div></section><div class="filters"><button class="filter active">About</button><button class="filter" onclick="notify('Stream clips are coming soon')">Clips</button></div><div class="muted">Welcome to ${esc(s.title)}! Enjoy the stream and chat with the community.</div></div><aside><section class="market"><div class="muted" style="font-size:10px;letter-spacing:1px">BREAKING ESPORTS CLIFF</div><h2>Prediction market</h2><div class="market-question">Will ${esc(s.user)} win this game?</div><small>Choose an outcome for this demo market.</small><div class="options"><button class="market-option ${state.selected==='Yes'?'selected':''}" onclick="state.selected='Yes';render()"><b>Yes</b><span class="muted">1.8×</span></button><button class="market-option ${state.selected==='No'?'selected':''}" onclick="state.selected='No';render()"><b>No</b><span class="muted">2.1×</span></button></div><button class="market-confirm" onclick="state.selected?notify('Demo pick recorded: '+state.selected):notify('Pick Yes or No first')">${state.selected?'Confirm demo pick':'Select an outcome'}</button><div class="market-state">${state.selected?'Selected: '+state.selected+' · Demo only':'Markets open once a game starts.'}</div></section><section class="chat"><h2>Chat <span class="muted" style="font-weight:400">· 1.4K</span></h2><div class="messages" id="messages">${state.chat.map(([u,m])=>`<div class="message"><b>${esc(u)}</b>${esc(m)}</div>`).join('')}</div><form class="chat-form" onsubmit="sendChat(event)"><input id="chat-input" placeholder="Send a message" maxlength="180"><button>Send</button></form></section></aside></div></div>`}
  function sendChat(e){e.preventDefault();const input=document.querySelector('#chat-input'),msg=input.value.trim();if(!msg)return;state.chat.push(['you',msg]);renderStream();document.querySelector('#messages').scrollTop=9999;document.querySelector('#chat-input').focus()}
  function renderMobile(){const s=streams[state.reel%streams.length];app.innerHTML=`<section class="mobile-shell" id="mobile-shell"><div class="mobile-reel" style="--scene1:${s.colors[0]};--scene2:${s.colors[1]};--glow:${s.colors[2]};--accent:${s.colors[2]}"><div class="mobile-scene"><div class="scene-word"><span>LIVE · ${s.views} viewers</span>${s.emoji}<br>${esc(s.title)}</div></div><div class="phone-frame"></div><div class="swipe-hint" id="hint">Swipe to explore · ${state.reel+1}/${streams.length}</div><div class="reel-info"><span class="pill">LIVE</span><h2>${esc(s.title)}</h2><div><b>${esc(s.user)}</b> <span class="muted">· ${s.views} viewers</span></div><div>${s.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div style="margin-top:9px;text-shadow:0 1px 3px #000">Catch the latest live moments and join the community.</div></div><div class="reel-actions"><div><button onclick="state.liked=!state.liked;this.textContent=state.liked?'♥':'♡'">${state.liked?'♥':'♡'}</button><small>${state.liked?'1.3K':'1.2K'}</small></div><div><button onclick="notify('Followed '+esc(s.user))">＋</button><small>Follow</small></div><div><button onclick="notify('Share link copied')">↗</button><small>Share</small></div><div><button onclick="notify('Chat opened for '+esc(s.title))">☰</button><small>Chat</small></div></div><nav class="mobile-nav"><button class="current" onclick="goHome()">⌂<br>Home</button><button onclick="notify('Browse categories')">◉<br>Browse</button><button onclick="notify('Your followed channels')">♡<br>Following</button><button onclick="toggleMenu('profile')">◉<br>Profile</button></nav></div></section>`;wireSwipe()}
  function nextReel(delta){state.reel=(state.reel+delta+streams.length)%streams.length;state.liked=false;render()}
  function wireSwipe(){const el=document.querySelector('#mobile-shell');let start=null;el.addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});el.addEventListener('touchend',e=>{if(start===null)return;const dy=e.changedTouches[0].clientY-start;if(Math.abs(dy)>45)nextReel(dy<0?1:-1);start=null},{passive:true});el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>30){nextReel(e.deltaY>0?1:-1)}},{passive:true});el.addEventListener('keydown',e=>{if(e.key==='ArrowDown')nextReel(1);if(e.key==='ArrowUp')nextReel(-1)})}
  function render(){drawHeader();if(state.route==='selector')renderSelector();else if(state.route==='stream')renderStream();else if(state.route==='mobile')renderMobile();else renderHome();renderNotice()}
  window.addEventListener('popstate',()=>{state.route=location.hash==='#mobile'?'mobile':location.hash==='#home'?'home':'selector';render()});
  window.addEventListener('keydown',e=>{if(state.route==='mobile'&&e.key==='ArrowDown')nextReel(1);if(state.route==='mobile'&&e.key==='ArrowUp')nextReel(-1);if(e.key==='Escape'){state.menu='';drawHeader()}});
  render();
  </script>
</body>
</html>
